[package]
name = "bpx-rag"
version = "0.3.0"
edition = "2021"
default-run = "bpx-rag"
description = "Local-first hybrid RAG retrieval and file relationship analysis for coding agents"
license = "MIT"
repository = "https://github.com/Blakethefn/bpx-rag"
homepage = "https://github.com/Blakethefn/bpx-rag"
authors = ["Blake Paulson"]
keywords = ["rag", "semantic-search", "code-search", "mcp", "repository"]
categories = ["command-line-utilities", "development-tools"]

[features]
default = []
gpu-cuda = ["ort/cuda", "ort/copy-dylibs"]

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
dirs = "6"
hf-hub = { version = "0.5", default-features = false, features = ["ureq", "rustls-tls"] }
fastembed = { version = "7.1.4", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "api-24"] }
glob = "0.3"
ignore = "0.4"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
strsim = "0.11"
toml = "0.8"
usearch = "=2.26.5"
tree-sitter = "=0.26.3"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "=0.25.0"
tree-sitter-dart = "0.2.0"
tree-sitter-elixir = "=0.3.5"
tree-sitter-erlang = "=0.21.0"
tree-sitter-go = "0.25.0"
tree-sitter-haskell = "=0.24.1"
tree-sitter-html = "=0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-julia = "=0.23.1"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-lua = "0.5.0"
tree-sitter-perl = "=1.1.2"
tree-sitter-powershell = "=0.26.4"
tree-sitter-php = "0.25.1"
tree-sitter-python = "0.25.0"
tree-sitter-r = "=1.3.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-scala = "=0.26.3"
tree-sitter-sequel = "=0.3.11"
tree-sitter-solidity = "=1.2.13"
tree-sitter-rust = "0.24.2"
tree-sitter-swift = "0.7.4"
tree-sitter-typescript = "0.23.2"

[dev-dependencies]
tempfile = "3"
