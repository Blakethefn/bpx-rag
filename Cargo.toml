[package]
name = "bpx-rag"
version = "0.3.0"
edition = "2021"
default-run = "bpx-rag"
description = "Filesystem-first file relationship analysis for coding agents"
license = "MIT"
repository = "https://github.com/Blakethefn/bpx-rag"
homepage = "https://github.com/Blakethefn/bpx-rag"
authors = ["Blake Paulson"]
keywords = ["code-analysis", "mcp", "imports", "wikilinks", "repository"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.27.1"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-dart = "0.2.0"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-lua = "0.5.0"
tree-sitter-php = "0.25.1"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-swift = "0.7.4"

[dev-dependencies]
tempfile = "3"
