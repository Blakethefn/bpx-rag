[package]
name = "bpx-rag"
version = "0.3.0"
edition = "2021"
default-run = "bpx-rag"
description = "Filesystem-first file relationship analysis for coding agents"
license = "MIT"
repository = "https://github.com/Blakethefn/bpx-rag"
homepage = "https://github.com/Blakethefn/bpx-rag"
authors = ["Blake Paulson"]
keywords = ["code-analysis", "mcp", "imports", "wikilinks", "repository"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
